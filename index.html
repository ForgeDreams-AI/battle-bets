<footer>Battle Bets v1 — demo credits only. Not real gambling. Lines via ESPN · settlement from final scores.</footer>

<script>
/* ============================================================
   BATTLE BETS v1 — peer-to-peer battle betting (demo credits)
   Money rule (confirmed): every stake splits 80/20.
   $4 of $5 = the wager (house keeps losers' $4, pays winners' $4).
   $1 of $5 = pot contribution. Winner takes the pot.
   ============================================================ */
'use strict';
const CFG = {
  VERSION: '1.0.0',
  STAKES: [1, 5, 10, 25],
  STARTING_CREDITS: 100,
  DISPUTE_WINDOW_H: 24,
  RATED_MIN_BETS: 5,
  DECAY_PER_30D: 0.98,
  LEAGUES: [
    {id:'nfl',   sport:'football',   label:'NFL'},
    {id:'ncaaf', sport:'football',   label:'College FB'},
    {id:'nba',   sport:'basketball', label:'NBA'},
    {id:'ncaam', sport:'basketball', label:'College BB'},
    {id:'mlb',   sport:'baseball',   label:'MLB'},
    {id:'nhl',   sport:'hockey',     label:'NHL'},
    {id:'usa.1', sport:'soccer',     label:'MLS'},
  ],
  ESPN_BASE: 'https://site.api.espn.com/apis/site/v2/sports',
  ODDS_API_BASE: 'https://api.the-odds-api.com/v4',
};
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt$ = n => '$' + Number(n).toFixed(2).replace(/\.00$/,'');
const fmtTime = iso => { try{ return new Date(iso).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});}catch(e){return iso;} };
const uid = p => (p||'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const todayKey = () => new Date().toISOString().slice(0,10);

/* ---------------- Store (localStorage) ---------------- */
const DB_KEY = 'battlebets_db_v1';
function defaultDB(){ return {
  users:{},            // id -> {id,name,createdAt,credits,settledBets:[],disputesLost:0,winStreak:0,lastSettledAt}
  bets:[],             // bet slips
  ledger:[],           // every credit movement
  audit:[],            // immutable grading/admin audit entries
  disputes:[],         // dispute records
  config:{ adminPw:'battleboss', oddsApiKey:'', adminName:'Anthony' },
  houseBalance:0,
  seq:0,
};}
function loadDB(){ try{ const d = JSON.parse(localStorage.getItem(DB_KEY)); if(d && d.users) return d; }catch(e){} return defaultDB(); }
function saveDB(){ localStorage.setItem(DB_KEY, JSON.stringify(DB)); }
let DB = loadDB();
function me(){ const id = localStorage.getItem('bb_me'); return id && DB.users[id] ? DB.users[id] : null; }
function setMe(id){ localStorage.setItem('bb_me', id); }

/* ---------------- Ledger ----------------
   Every credit movement is an entry. Invariant:
   sum(user balances) + houseBalance == total credits ever issued.
   Entry: {id,ts,userId,battleId,type,amount,note,balanceAfter}  */
function postLedger(userId, battleId, type, amount, note){
  const u = DB.users[userId];
  const entry = { id:uid('L'), ts:new Date().toISOString(), userId, battleId, type,
    amount:+amount.toFixed(2), note:note||'',
    balanceAfter: u ? +(u.credits + amount).toFixed(2) : null };
  if(u){ u.credits = entry.balanceAfter; }
  DB.ledger.push(entry); saveDB(); return entry;
}
function houseTake(amount, battleId, note){
  DB.houseBalance = +(DB.houseBalance + amount).toFixed(2);
  audit('house', battleId, 'house_take', `${fmt$(amount)} → house. ${note||''} House balance now ${fmt$(DB.houseBalance)}.`);
  saveDB();
}
function audit(actorId, battleId, kind, text){
  DB.audit.push({ id:uid('A'), ts:new Date().toISOString(), actorId, battleId, kind, text });
  saveDB();
}

/* ---------------- Bet engine ---------------- */
function splitStake(stake){ const w = +(stake*0.8).toFixed(2), p = +(stake*0.2).toFixed(2); return {wager:w, pot:p}; }
/* Winnings on a wager at American odds (stake NOT included). */
function winnings(wager, americanOdds){
  const o = americanOdds==null ? -110 : +americanOdds;
  const w = o>0 ? wager*(o/100) : wager*(100/Math.abs(o));
  return +w.toFixed(2);
}
function fmtOdds(o){ o=+o; return (o>0?'+':'')+o; }

function createBet(o){
  // o: {mode, eventId, league, homeAbbr, awayAbbr, homeName, awayName, eventDate,
  //     market, selection, line, odds, oppOdds, consensusLine, lineSource, stake, customLine?}
  // REFINED MODEL: a challenge = TWO independent house bets (one per battler, at
  // real odds) + ONE linked head-to-head pot. No-challenge = full stake vs house.
  const u = me(); if(!u) throw new Error('no-user');
  if(u.credits < o.stake) throw new Error('insufficient');
  const isChallenge = o.mode==='challenge';
  const wager = isChallenge ? +(o.stake*0.8).toFixed(2) : +(+o.stake).toFixed(2);
  const pot = isChallenge ? +(o.stake*0.2).toFixed(2) : 0;
  const odds = o.odds==null ? -110 : +o.odds;
  const oppOdds = o.oppOdds==null ? -110 : +o.oppOdds;
  const bet = {
    id:'BB-'+(++DB.seq).toString().padStart(5,'0')+'-'+Math.random().toString(36).slice(2,6).toUpperCase(),
    createdAt:new Date().toISOString(),
    creatorId:u.id, creatorName:u.name,
    mode:o.mode, // 'house' | 'challenge'
    eventId:o.eventId, league:o.league,
    homeAbbr:o.homeAbbr, awayAbbr:o.awayAbbr, homeName:o.homeName, awayName:o.awayName,
    eventDate:o.eventDate,
    market:o.market,            // 'spread'|'total'|'moneyline'
    selection:o.selection,      // 'home'|'away'|'over'|'under'
    line:o.line,                // locked line at creation (home-spread convention for spread; ML odds for moneyline)
    odds, oppOdds,              // American odds: creator's side / opposite side (challenge taker's)
    takerOdds:null,             // set when a taker accepts (= oppOdds)
    consensusLine:o.consensusLine, lineSource:o.lineSource||'espn', customLine:!!o.customLine,
    takerId:null, takerName:null,
    stake:o.stake, wager, potShare:pot,
    status: o.mode==='challenge' ? 'open' : 'matched',
    grade:null, dispute:null, settledAt:null,
  };
  DB.bets.push(bet);
  const stakeNote = isChallenge
    ? `Staked ${fmt$(o.stake)} on ${describeSelection(bet)} — leg 1: ${fmt$(wager)} house bet @ ${fmtOdds(odds)} · leg 2: ${fmt$(pot)} challenge pot`
    : `Staked ${fmt$(o.stake)} on ${describeSelection(bet)} @ ${fmtOdds(odds)} vs house`;
  postLedger(u.id, bet.id, 'stake_placed', -o.stake, stakeNote);
  audit(u.id, bet.id, 'bet_created', `${u.name} created ${o.mode} bet ${bet.id}: ${describeSelection(bet)} @ ${fmt$(o.stake)} (line ${o.line}, source ${o.lineSource}).`);
  saveDB(); return bet;
}
function acceptChallenge(betId){
  const u = me(); if(!u) throw new Error('no-user');
  const bet = DB.bets.find(b=>b.id===betId); if(!bet || bet.status!=='open') throw new Error('not-open');
  if(bet.creatorId===u.id) throw new Error('own-bet');
  if(u.credits < bet.stake) throw new Error('insufficient');
  bet.takerId = u.id; bet.takerName = u.name; bet.status = 'matched';
  bet.takerSelection = oppositeSelection(bet.market, bet.selection);
  bet.takerOdds = bet.oppOdds; // taker's house leg is priced at the opposite side's odds
  postLedger(u.id, bet.id, 'stake_placed', -bet.stake, `Accepted challenge ${bet.id}: ${describeSelectionFor(bet, bet.takerSelection)} @ ${fmt$(bet.stake)}`);
  audit(u.id, bet.id, 'challenge_accepted', `${u.name} took the other side (${describeSelectionFor(bet, bet.takerSelection)}). Battle is matched.`);
  saveDB(); return bet;
}
function oppositeSelection(market, sel){
  if(market==='spread'||market==='moneyline') return sel==='home'?'away':'home';
  return sel==='over'?'under':'over';
}
function describeSelection(b){ return describeSelectionFor(b, b.selection); }
function describeSelectionFor(b, sel){
  const H=b.homeAbbr, A=b.awayAbbr;
  if(b.market==='spread'){ const ln = sel==='home' ? b.line : -b.line;
    const team = sel==='home'?H:A; return `${team} ${ln>0?'+':''}${ln}`; }
  if(b.market==='total'){ return `${sel==='over'?'Over':'Under'} ${b.line}`; }
  return `${sel==='home'?H:A} ML`;
}

/* Grading: result for a SELECTION given final scores.
   Spread convention: bet.line = HOME spread (e.g. -7.5). cover = (home+line)-away. */
function gradeSelection(bet, homeScore, awayScore){
  const hs=+homeScore, as=+awayScore;
  if(bet.market==='spread'){
    const cover = (hs + bet.line) - as;
    const s = bet.selection;
    if(cover===0) return 'push';
    return (s==='home' ? cover>0 : cover<0) ? 'win':'loss';
  }
  if(bet.market==='total'){
    const t = hs+as;
    if(t===bet.line) return 'push';
    return (bet.selection==='over' ? t>bet.line : t<bet.line) ? 'win':'loss';
  }
  // moneyline
  if(hs===as) return 'push';
  const winner = hs>as?'home':'away';
  return bet.selection===winner?'win':'loss';
}

/* Settle a bet from a final score. Writes ledger + audit. Idempotent.
   REFINED MODEL:
   - house mode: full stake is ONE standard house bet at real odds.
   - challenge: TWO independent house bets (creator's leg + taker's leg, each at
     their own odds) + ONE winner-take-all challenge pot (both 20% shares).
   - push: every leg pushes — full refunds. void: full refunds. */
function settleBet(bet, homeScore, awayScore, source){
  if(bet.status==='settled'||bet.status==='void') return bet;
  const res = gradeSelection(bet, homeScore, awayScore);
  bet.grade = { result:res, homeScore:+homeScore, awayScore:+awayScore, source, gradedAt:new Date().toISOString(), rule: gradeRuleText(bet,res) };
  applySettlement(bet, res);
  bet.status='settled'; bet.settledAt=new Date().toISOString();
  recordSettled(bet, res);
  saveDB(); return bet;
}
/* Grade one house-bet leg. Returns {wager, odds, result, payout, houseDelta}.
   houseDelta is the HOUSE's P&L on the leg: +wager when the house keeps a
   losing stake, −winnings when the house pays a winner, 0 on push. */
function settleHouseLeg(userId, bet, wager, odds, result){
  const w = +wager.toFixed(2);
  if(result==='win'){
    const win = winnings(w, odds);
    const payout = +(w + win).toFixed(2);
    postLedger(userId, bet.id, 'housebet_payout', payout,
      `House bet won @ ${fmtOdds(odds)} — ${fmt$(w)} back + ${fmt$(win)} winnings`);
    return { wager:w, odds:+odds, result, payout, houseDelta:+(-win).toFixed(2) };
  }
  if(result==='push'){
    postLedger(userId, bet.id, 'housebet_refund_push', w, `House bet pushed — ${fmt$(w)} returned`);
    return { wager:w, odds:+odds, result, payout:w, houseDelta:0 };
  }
  return { wager:w, odds:+odds, result, payout:0, houseDelta:w }; // house keeps the stake
}
/* Full push refund for one battler: house leg back + pot share back (challenge). */
function refundLegPush(userId, bet){
  postLedger(userId, bet.id, 'housebet_refund_push', +bet.wager.toFixed(2), `Push — house-bet leg ${fmt$(bet.wager)} returned`);
  if(bet.mode==='challenge' && bet.potShare>0)
    postLedger(userId, bet.id, 'pot_refund_push', +bet.potShare.toFixed(2), `Push — challenge pot share ${fmt$(bet.potShare)} returned`);
}
function applySettlement(bet, res, hs, as){
  // res: creator's selection result ('win'|'loss'|'push'). Taker's result is the
  // complement (opposite side, same event) — the pot keys off the same outcome.
  // hs/as: fallback scores when re-settling after a dispute overturn (grade was reversed).
  const g = bet.grade || { homeScore:hs??0, awayScore:as??0, source:'dispute-overturn' };
  const legs = {};
  let houseDelta = 0, potPaid = 0, potWinner = null;
  if(res==='push'){
    refundLegPush(bet.creatorId, bet);
    if(bet.takerId) refundLegPush(bet.takerId, bet);
    audit('system', bet.id, 'graded', `graded PUSH (${g.homeScore}-${g.awayScore}, ${g.source}). All legs refunded in full.`);
  } else if(bet.mode==='house'){
    const L = settleHouseLeg(bet.creatorId, bet, bet.wager, bet.odds, res);
    legs.creator = L; houseDelta = L.houseDelta;
    audit('system', bet.id, 'graded', `graded ${res.toUpperCase()} vs house (${g.homeScore}-${g.awayScore}, ${g.source}). ${gradeRuleText(bet,res)} Leg: ${fmt$(L.wager)} @ ${fmtOdds(L.odds)} → payout ${fmt$(L.payout)}.`);
  } else {
    const takerRes = res==='win' ? 'loss' : 'win';
    const Lc = settleHouseLeg(bet.creatorId, bet, bet.wager, bet.odds, res);
    const Lt = settleHouseLeg(bet.takerId, bet, bet.wager, bet.takerOdds, takerRes);
    legs.creator = Lc; legs.taker = Lt;
    houseDelta = +(Lc.houseDelta + Lt.houseDelta).toFixed(2);
    const potTotal = +(bet.potShare*2).toFixed(2);
    potWinner = res==='win' ? bet.creatorId : bet.takerId;
    postLedger(potWinner, bet.id, 'pot_win', potTotal, `Won the battle — takes the ${fmt$(potTotal)} challenge pot`);
    potPaid = potTotal;
    audit('system', bet.id, 'graded', `graded ${res==='win'?'CREATOR':'TAKER'} WINS (${g.homeScore}-${g.awayScore}, ${g.source}). ${gradeRuleText(bet,res)} Legs: creator ${fmt$(Lc.wager)} @ ${fmtOdds(Lc.odds)} → ${Lc.result} (${fmt$(Lc.payout)}); taker ${fmt$(Lt.wager)} @ ${fmtOdds(Lt.odds)} → ${Lt.result} (${fmt$(Lt.payout)}). Pot ${fmt$(potTotal)} → ${DB.users[potWinner].name}.`);
  }
  bet._legs = legs; bet._potPaid = potPaid; bet._houseDelta = +houseDelta.toFixed(2);
  if(houseDelta!==0) houseTake(houseDelta, bet.id, houseDelta>0 ? 'house keeps losing leg stake(s) — the vig' : 'house paid leg winnings');
  saveDB();
}
function voidBet(bet, reason){
  if(bet.status==='settled'||bet.status==='void') return bet;
  postLedger(bet.creatorId, bet.id, 'refund_void', bet.stake, `Void — ${reason}`);
  if(bet.takerId) postLedger(bet.takerId, bet.id, 'refund_void', bet.stake, `Void — ${reason}`);
  bet.status='void'; bet.grade={result:'void',rule:reason,gradedAt:new Date().toISOString(),source:'system'};
  audit('system', bet.id, 'void', `VOIDED: ${reason}. Stakes returned.`);
  saveDB(); return bet;
}
function gradeRuleText(bet,res){
  const H=bet.homeAbbr,A=bet.awayAbbr;
  if(bet.market==='spread') return `Spread: home ${H} ${bet.line>0?'+':''}${bet.line}. Cover margin ${(bet.grade?bet.grade.homeScore:0)} vs ${(bet.grade?bet.grade.awayScore:0)} → ${res}.`;
  if(bet.market==='total') return `Total ${bet.line}: final total ${((bet.grade?bet.grade.homeScore:0)+(bet.grade?bet.grade.awayScore:0))} → ${bet.selection} ${res}.`;
  return `Moneyline: ${bet.selection==='home'?H:A} ${res==='win'?'won':'lost'} outright → ${res}.`;
}
function recordSettled(bet, res){
  const ids = [bet.creatorId, bet.takerId].filter(Boolean);
  ids.forEach(id=>{
    const u = DB.users[id]; if(!u) return;
    const won = (id===bet.creatorId) ? (res==='win') : (res==='loss'); // taker wins when creator loses
    if(res==='push'||res==='void') return;
    u.settledBets = u.settledBets||[];
    u.settledBets.push({betId:bet.id, won, ts:new Date().toISOString()});
    u.winStreak = won ? (u.winStreak||0)+1 : 0;
    u.lastSettledAt = new Date().toISOString();
  });
}

/* ---------------- Disputes ---------------- */
function fileDispute(betId, reason, evidence){
  const u=me(); const bet=DB.bets.find(b=>b.id===betId);
  if(!bet||bet.status!=='settled') throw new Error('bad-state');
  const hrs=(Date.now()-new Date(bet.settledAt).getTime())/36e5;
  if(hrs>CFG.DISPUTE_WINDOW_H) throw new Error('window-closed');
  const d={id:uid('D'), betId, byId:u.id, byName:u.name, reason, evidence, filedAt:new Date().toISOString(), status:'open', decision:null};
  DB.disputes.push(d); bet.status='disputed'; bet.dispute=d.id;
  audit(u.id, betId, 'dispute_filed', `${u.name} disputed grade: ${reason}. Evidence: ${evidence}`);
  saveDB(); return d;
}
function resolveDispute(disputeId, decision, adminNote){
  // decision: 'uphold' | 'overturn_win' | 'overturn_loss' | 'overturn_push' | 'overturn_void'
  const d=DB.disputes.find(x=>x.id===disputeId); if(!d||d.status!=='open') throw new Error('bad');
  const bet=DB.bets.find(b=>b.id===d.betId);
  d.status='decided'; d.decision=decision; d.decidedAt=new Date().toISOString(); d.decidedBy=DB.config.adminName; d.adminNote=adminNote||'';
  const filer=DB.users[d.byId];
  if(decision==='uphold'){
    bet.status='settled';
    if(filer){ filer.disputesLost=(filer.disputesLost||0)+1; }
    audit('admin', bet.id, 'dispute_resolved', `Dispute UPHELD (grade stands). ${d.byName} loses the dispute — trust rating dinged. Note: ${d.adminNote}`);
  } else {
    // reverse settlement, then re-settle with corrected result
    const hs = bet.grade ? bet.grade.homeScore : 0, as = bet.grade ? bet.grade.awayScore : 0;
    reverseSettlement(bet);
    const map={overturn_win:'win',overturn_loss:'loss',overturn_push:'push',overturn_void:'void'};
    const res=map[decision];
    if(res==='void'){ voidBet(bet,'Overturned on dispute: '+d.adminNote); }
    else{ settleBetForced(bet,res,hs,as); }
    const otherId = d.byId===bet.creatorId ? bet.takerId : bet.creatorId;
    const other = otherId&&DB.users[otherId];
    if(other){ other.disputesLost=(other.disputesLost||0)+1; }
    audit('admin', bet.id, 'dispute_resolved', `Dispute OVERTURNED → ${res.toUpperCase()}. Settlement reversed and re-applied. ${d.byName} wins the dispute; counterparty trust rating dinged. Note: ${d.adminNote}`);
  }
  saveDB(); return d;
}
function reverseSettlement(bet){
  // Post exact-reversal entries for SETTLEMENT movements only (payouts, pot wins,
  // refunds). Stakes stay deducted — the money is still in play for the re-grade.
  // Never delete entries; the ledger is append-only.
  const SETTLE_TYPES = ['housebet_payout','housebet_refund_push','pot_win','pot_refund_push',
    'refund_push','refund_void',          // push/void refunds
    'payout_wager'];                      // legacy v1 entry type (old localStorage DBs)
  [...DB.ledger].reverse().forEach(e=>{
    if(e.battleId!==bet.id || !SETTLE_TYPES.includes(e.type)) return;
    if(e.userId && DB.users[e.userId]){
      postLedger(e.userId, bet.id, 'reversal', -e.amount, `Reversal of ${e.type} (${e.id}) — dispute overturn`);
    }
  });
  if(bet._houseDelta){ houseTake(-bet._houseDelta, bet.id, 'reversal of settlement (dispute overturn)'); bet._houseDelta=0; }
  // strip the original settled record so ratings don't double-count the battle
  [bet.creatorId, bet.takerId].filter(Boolean).forEach(id=>{
    const u=DB.users[id];
    if(u && u.settledBets) u.settledBets = u.settledBets.filter(s=>s.betId!==bet.id);
  });
  bet.status='matched'; bet.grade=null; bet.settledAt=null; saveDB();
}
function settleBetForced(bet, res, hs, as){
  // re-settle with an admin-forced result (used after dispute overturn)
  applySettlement(bet, res, hs, as);
  bet.grade={result:res,homeScore:hs||0,awayScore:as||0,source:'dispute-overturn',gradedAt:new Date().toISOString(),rule:'Admin overturn on dispute'};
  bet.status='settled'; bet.settledAt=new Date().toISOString();
  recordSettled(bet,res); saveDB();
}

/* ============================================================
   DATA LAYER — real sports data
   Primary: ESPN public API (free, no key, CORS-open)
     - Scoreboard: games, teams, scores, status (for settlement)
     - Summary pickcenter: real DraftKings lines (spread/total/ML)
   Optional: The Odds API free tier (key in Admin → Data)
   Fallback: clearly-labeled demo lines so the app always works
   ============================================================ */
const _cache = {};
function cached(key, ms){ const c=_cache[key]; return (c && Date.now()-c.t < ms) ? c.v : null; }
function setCache(key, v){ _cache[key]={t:Date.now(), v}; }
async function espnScoreboard(leagueId){
  const lg = CFG.LEAGUES.find(l=>l.id===leagueId);
  const key='sb_'+leagueId; const hit=cached(key, 60000); if(hit) return hit;
  const url = `${CFG.ESPNG_BASE||CFG.ESPN_BASE}/sports/${lg.sport}/leagues/${leagueId}/scoreboard?limit=50`;
  const r = await fetch(url); if(!r.ok) throw new Error('espn '+r.status);
  const d = await r.json(); setCache(key, d); return d;
}
function parseEvent(e, leagueId){
  const comp = e.competitions[0] || {};
  const t0 = comp.competitors?.find(c=>c.homeAway==='home');
  const t1 = comp.competitors?.find(c=>c.homeAway==='away');
  const st = e.status?.type || {};
  return {
    id:String(e.id), league:leagueId,
    name:e.name, shortName:e.shortName, date:e.date,
    homeAbbr:t0?.team?.abbreviation||'H', awayAbbr:t1?.team?.abbreviation||'A',
    homeName:t0?.team?.displayName||'', awayName:t1?.team?.displayName||'',
    homeScore:t0?.score!=null?+t0.score:null, awayScore:t1?.score!=null?+t1.score:null,
    statusDesc:st.description||'', completed:!!st.completed,
    state: st.state||'',
  };
}
async function espnLines(eventId, leagueId){
  // Real lines from ESPN's pickcenter (DraftKings). Returns {spread,total,homeML,awayML,provider} or null.
  const lg = CFG.LEAGUES.find(l=>l.id===leagueId);
  const key='ln_'+eventId; const hit=cached(key, 5*60000); if(hit) return hit;
  try{
    const url = `${CFG.ESPN_BASE}/sports/${lg.sport}/leagues/${leagueId}/summary?event=${eventId}`;
    const r = await fetch(url); if(!r.ok) return null;
    const d = await r.json();
    const pc = (d.pickcenter||[])[0];
    if(!pc || pc.spread==null) return null;
    const out = { spread:+pc.spread, total: pc.overUnder!=null?+pc.overUnder:null,
      homeML: pc.homeTeamOdds?.moneyLine ?? null, awayML: pc.awayTeamOdds?.moneyLine ?? null,
      provider: pc.provider?.name||'ESPN', source:'espn' };
    setCache(key, out); return out;
  }catch(e){ return null; }
}
function demoLines(homeAbbr, awayAbbr){
  // Clearly-labeled fallback so the app is fully usable when books haven't posted lines.
  const h = homeAbbr.charCodeAt(0)+homeAbbr.charCodeAt(1||0);
  const spread = -(((h*7)%13)-6) - 0.5;         // e.g. -6.5 … +6.5
  const total = 38 + ((h*13)%17) + 0.5;          // e.g. 38.5 … 54.5
  return { spread:+spread.toFixed(1), total:+total.toFixed(1), homeML:-110, awayML:-110,
    provider:'Demo', source:'demo' };
}
async function oddsApiLines(eventHome, eventAway, leagueId){
  // Optional enhancement: The Odds API free tier (500 req/mo). Key pasted in Admin → Data.
  const key = DB.config.oddsApiKey && DB.config.oddsApiKey.trim();
  if(!key) return null;
  const sportKey = {nfl:'americanfootball_nfl',nba:'basketball_nba',mlb:'baseball_mlb',nhl:'icehockey_nhl',ncaaf:'americanfootball_ncaaf',ncaam:'basketball_ncaab',"usa.1":'soccer_usa_mls'}[leagueId];
  if(!sportKey) return null;
  const ck='oa_'+leagueId; const hit=cached(ck, 10*60000); if(hit) return hit;
  try{
    const r = await fetch(`${CFG.ODDS_API_BASE}/sports/${sportKey}/odds/?apiKey=${encodeURIComponent(key)}&regions=us&markets=spreads,totals,h2h&oddsFormat=american`);
    if(!r.ok) return null;
    const games = await r.json();
    const g = games.find(x => (x.home_team||'').toLowerCase().includes(eventHome.toLowerCase().slice(0,4)) || (x.away_team||'').toLowerCase().includes(eventAway.toLowerCase().slice(0,4)));
    if(!g || !g.bookmakers?.length) return null;
    const bm = g.bookmakers[0];
    const sp = bm.markets.find(m=>m.key==='spreads')?.outcomes || [];
    const tt = bm.markets.find(m=>m.key==='totals')?.outcomes || [];
    const h2h = bm.markets.find(m=>m.key==='h2h')?.outcomes || [];
    const out = {
      spread: sp.find(o=>o.name===g.home_team)?.point ?? null,
      total: tt[0]?.point ?? null,
      homeML: h2h.find(o=>o.name===g.home_team)?.price ?? null,
      awayML: h2h.find(o=>o.name===g.away_team)?.price ?? null,
      provider: bm.title||'OddsAPI', source:'oddsapi',
    };
    if(out.spread==null && out.total==null) return null;
    setCache(ck, out); return out;
  }catch(e){ return null; }
}

/* ============================================================
   RATINGS
   --- Bettor Score (trust rating) ---
   Settled real-stake bets only. New users "Unrated" until 5 settled.
   score = 1000
         + 400*(winRate-0.5)          // edge: 40% weight
         + 10*min(settled,50)         // volume, capped
         - 75*disputesLost            // dispute record
         + 25*min(winStreak,4)        // hot streak bonus, capped
   then × 0.98 per 30 days of inactivity. Clamped 100..2000.
   --- Line score ---
   Compares a locked line to consensus at creation; flags stale lines
   when consensus moved before the taker accepts.
   ============================================================ */
function bettorStats(userId){
  const u = DB.users[userId]; if(!u) return null;
  const settled = (u.settledBets||[]).filter(s=>{
    const b = DB.bets.find(x=>x.id===s.betId);
    return b && (b.status==='settled'); // voids/pushes excluded from win-rate
  });
  const decisive = settled; // pushes already excluded in recordSettled
  const wins = decisive.filter(s=>s.won).length;
  return { settled:decisive.length, wins, winRate: decisive.length? wins/decisive.length : 0,
    disputesLost:u.disputesLost||0, winStreak:u.winStreak||0, lastSettledAt:u.lastSettledAt };
}
function bettorScore(userId){
  const u = DB.users[userId]; if(!u) return {rated:false, score:null};
  const s = bettorStats(userId);
  if(s.settled < CFG.RATED_MIN_BETS) return {rated:false, score:null, settled:s.settled};
  let score = 1000 + 400*(s.winRate-0.5) + 10*Math.min(s.settled,50) - 75*s.disputesLost + 25*Math.min(s.winStreak,4);
  if(s.lastSettledAt){
    const daysInactive = (Date.now()-new Date(s.lastSettledAt).getTime())/864e5;
    if(daysInactive>30) score *= Math.pow(CFG.DECAY_PER_30D, Math.floor(daysInactive/30));
  }
  score = Math.max(100, Math.min(2000, Math.round(score)));
  return {rated:true, score, ...s};
}
function scoreTier(score){
  if(score==null) return 'Unrated';
  if(score>=1400) return 'Elite'; if(score>=1200) return 'Sharp';
  if(score>=1000) return 'Solid'; if(score>=800) return 'Casual'; return 'Cold';
}
/* Line score: value of a locked line vs consensus, from a side's view.
   Returns {delta, favors} — positive delta = points of value for `side`. */
function lineScore(market, lockedLine, consensusLine, side){
  if(lockedLine==null || consensusLine==null) return null;
  let delta = 0;
  if(market==='total'){
    delta = side==='over' ? (lockedLine - consensusLine) : (consensusLine - lockedLine);
  } else if(market==='spread'){
    // spread is home-perspective; value depends on side
    delta = side==='home' ? (consensusLine - lockedLine) : (lockedLine - consensusLine);
    // e.g. locked -3 vs consensus -6.5: home side gets 3.5 pts of value
  } else return null;
  return { delta:+delta.toFixed(1), favors: delta>0.4 ? side : (delta<-0.4 ? oppositeSelection(market,side) : 'even') };
}
async function lineMovedWarning(bet){
  // Re-fetch current consensus; warn taker if it moved a lot since creation.
  const cur = await espnLines(bet.eventId, bet.league);
  if(!cur || bet.consensusLine==null) return null;
  const ref = bet.market==='spread' ? cur.spread : cur.total;
  if(ref==null) return null;
  const move = Math.abs(ref - bet.consensusLine);
  const thresh = bet.market==='spread' ? 1.5 : 2.0;
  return move >= thresh ? {from:bet.consensusLine, to:ref, move:+move.toFixed(1)} : null;
}

    <div id="mode-note"></div>
    <label>Market</label>
    <div class="adm-tabs" id="mkt-tabs">

      <button data-k="moneyline">Moneyline</button>
    </div>

    <div class="side-pick" id="side-pick"></div>
    ${mode==='challenge'?`<label>Line (locked for both battlers) <span class="tiny mut">— set your own or use consensus</span></label>
    <div class="row-flex"><input id="custom-line" type="number" step="0.5" placeholder="Consensus: ${mktLine()}" style="margin:0;"><button class="btn btn-ghost btn-sm" onclick="useConsensus()">Use consensus</button></div>
    <div id="line-score-box"></div>`:''}
    <label>Stake</label>
    <div class="stake-pick" id="stake-pick">${CFG.STAKES.map(s=>`<button data-s="${s}" class="${s===5?'sel':''}">$${s}</button>`).join('')}</div>

    <button class="btn ${mode==='challenge'?'btn-green':'btn-navy'} btn-block" onclick="placeBet()">${mode==='challenge'?'⚔️ Create challenge':'🎟️ Lock bet vs house'}</button>
    <div id="bet-msg"></div>
  </div>`;
  app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{G.mode=b.dataset.m; renderGameCard();});
  app.querySelectorAll('#mkt-tabs button').forEach(b=>b.onclick=()=>{G.market=b.dataset.k; G.selection = G.market==='total'?'over':'home'; G.customLine=null; setSideOdds(); renderGameCard();});
  paintSides(); paintStakes(); paintSlip(); paintModeNote();
  const cl=$('#custom-line'); if(cl){ cl.oninput=()=>{ G.customLine = cl.value===''? null : +cl.value; paintSlip(); paintLineScore(); }; }
  paintLineScore();
}
function mktLine(){ const {ln,market}=G; return market==='spread'?ln.spread : market==='total'?ln.total : null; }
/* American odds for the current side + the opposite side (challenge taker's leg).
   Spread/total default to standard -110; moneyline uses the feed's ML prices. */
function setSideOdds(){
  const {ln, market, selection} = G;
  if(market==='moneyline'){
    G.odds = selection==='home' ? (ln.homeML??-110) : (ln.awayML??-110);
    G.oppOdds = selection==='home' ? (ln.awayML??-110) : (ln.homeML??-110);
  } else { G.odds = -110; G.oppOdds = -110; }
}
function payoutPreview(wager, odds){ return fmt$(+(wager + winnings(wager, odds)).toFixed(2)); }
function paintModeNote(){
  const el=$('#mode-note'); if(!el) return;
  el.innerHTML = G.mode==='challenge'
    ? `<div class="okbox">⚔️ <b>Challenge mode = two separate bets:</b> 80% of your stake is a standard bet vs the house at the locked odds; 20% goes into a head-to-head pot. Your friend's 80% is their own house bet. Winner of the matchup takes the whole pot.</div>`
    : `<div class="warn">🏠 <b>Vs house:</b> your full stake is a standard bet vs the house at the locked odds. No pot.</div>`;
}
function paintSides(){
  const el=$('#side-pick'); const {e,market}=G;
  const opts = market==='spread'||market==='moneyline'
    ? [['home',`${e.homeAbbr}`],['away',`${e.awayAbbr}`]]
    : [['over','Over '+mktLine()],['under','Under '+mktLine()]];
  el.innerHTML = opts.map(([v,l])=>`<button data-v="${v}" class="${G.selection===v?'sel':''}">${l}</button>`).join('');
  el.querySelectorAll('button').forEach(b=>b.onclick=()=>{G.selection=b.dataset.v; setSideOdds(); paintSides(); paintSlip(); paintLineScore();});
}
function paintStakes(){
  const el=$('#stake-pick');
  el.querySelectorAll('button').forEach(b=>b.onclick=()=>{G.stake=+b.dataset.s; el.querySelectorAll('button').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); paintSlip();});
}
function useConsensus(){ G.customLine=null; const cl=$('#custom-line'); if(cl) cl.value=''; paintSlip(); paintLineScore(); }
function lockedLine(){ return G.customLine!=null ? G.customLine : mktLine(); }
function paintLineScore(){
  const box=$('#line-score-box'); if(!box) return;
  if(G.mode!=='challenge' || G.market==='moneyline'){ box.innerHTML=''; return; }
  const ls = lineScore(G.market, lockedLine(), mktLine(), G.selection);
  if(!ls || G.customLine==null){ box.innerHTML = `<p class="tiny mut">Line score: using consensus line — rated even.</p>`; return; }
  const fav = ls.favors==='even' ? 'Even line.' : ls.delta>0 ? `Favors <b>you</b> by ${ls.delta} pts.` : `Favors <b>taker</b> by ${Math.abs(ls.delta)} pts.`;
  box.innerHTML = `<div class="${ls.delta<-0.4?'warn':'okbox'}"><b>Line score:</b> locked ${lockedLine()} vs consensus ${mktLine()} — ${fav}</div>`;
}
function paintSlip(){
  const el=$('#slip-preview'); if(!el) return;
  const {e,mode,market,selection,stake,lineSource,odds,oppOdds}=G;
  const tmp={homeAbbr:e.homeAbbr,awayAbbr:e.awayAbbr,market,selection,line:lockedLine()};
  const wager = mode==='challenge' ? +(stake*0.8).toFixed(2) : stake;
  const pot = mode==='challenge' ? +(stake*0.2).toFixed(2) : 0;
  const leg1 = mode==='challenge'
    ? `<div class="small"><b>Leg 1 — house bet:</b> ${fmt$(wager)} on ${esc(describeSelectionFor(tmp,selection))} @ <b>${fmtOdds(odds)}</b> <span class="tiny mut">→ win pays ${payoutPreview(wager,odds)}</span></div>
       <div class="small"><b>Leg 2 — challenge pot:</b> ${fmt$(pot)} vs your friend <span class="tiny mut">→ winner takes ${fmt$(pot*2)}</span></div>`
    : `<div class="small"><b>House bet:</b> ${fmt$(wager)} on ${esc(describeSelectionFor(tmp,selection))} @ <b>${fmtOdds(odds)}</b> <span class="tiny mut">→ win pays ${payoutPreview(wager,odds)}</span></div>`;
  el.innerHTML=`
    <div class="k">Bet slip — ${mode==='challenge'?'⚔️ Challenge (two separate bets)':'🏠 Vs House'}</div>
    <div class="v">${esc(e.awayAbbr)} @ ${esc(e.homeAbbr)}${market!=='moneyline'?` — line <b>${lockedLine()}</b> <span class="tiny mut">(locked${lineSource==='demo'?' · demo':''})</span>`:''}</div>
    ${leg1}
    <div class="tiny mut">Stake ${fmt$(stake)} · settles from final score via ESPN · ${CFG.DISPUTE_WINDOW_H}h dispute window</div>`;
}
async function placeBet(){
  const msg=$('#bet-msg'); const u=me();
  try{
    if(u.credits < G.stake) throw new Error('Not enough demo credits.');
    const {e,ln,lineSource,mode,market,selection,stake}=G;
    const line = market==='moneyline' ? (selection==='home'?ln.homeML:ln.awayML) : lockedLine();
    const bet = createBet({ mode, eventId:e.id, league:e.league, homeAbbr:e.homeAbbr, awayAbbr:e.awayAbbr,
      homeName:e.homeName, awayName:e.awayName, eventDate:e.date, market, selection, line,
      odds:G.odds, oppOdds:G.oppOdds,
      consensusLine: lineSource==='demo'?null:mktLine(), lineSource, stake, customLine: G.customLine!=null });
    if(mode==='challenge'){
      const link = challengeLink(bet);
      msg.innerHTML=`<div class="okbox">⚔️ <b>Challenge created!</b> Share this link — your friend opens it, takes the other side, and you battle:<br>
        <input id="ch-link" readonly value="${esc(link)}" onclick="this.select()">
        <button class="btn btn-green btn-sm" style="margin-top:8px;" onclick="copyChallenge()">Copy link</button>
        <a class="btn btn-ghost btn-sm" style="margin-top:8px;" href="#/bets">View my bets →</a></div>`;
    } else {
      msg.innerHTML=`<div class="okbox">🎟️ <b>Bet locked!</b> ${esc(describeSelection(bet))} @ ${fmt$(stake)}. Good luck.<br><a href="#/bets">View my bets →</a></div>`;
    }
    renderTabs();
  }catch(err){ msg.innerHTML=`<div class="errbox">${esc(err.message==='insufficient'?'Not enough demo credits.':err.message)}</div>`; }
}
function challengePayload(bet){
  return { v:2, id:bet.id, eventId:bet.eventId, league:bet.league, homeAbbr:bet.homeAbbr, awayAbbr:bet.awayAbbr,
    homeName:bet.homeName, awayName:bet.awayName, eventDate:bet.eventDate, market:bet.market, selection:bet.selection,
    line:bet.line, odds:bet.odds, oppOdds:bet.oppOdds, consensusLine:bet.consensusLine, lineSource:bet.lineSource, stake:bet.stake,
    creatorId:bet.creatorId, creatorName:bet.creatorName, createdAt:bet.createdAt };
}
function challengeLink(bet){
  const p = btoa(unescape(encodeURIComponent(JSON.stringify(challengePayload(bet)))))
    .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  return location.origin + location.pathname + '#/c/' + p;
}
function copyChallenge(){ const i=$('#ch-link'); i.select(); document.execCommand('copy');
  try{ navigator.clipboard.writeText(i.value); }catch(e){} alert('Challenge link copied — send it to your friend.'); }

/* ---------- Accept a challenge (from share link) ---------- */
async function renderChallengeAccept(payload){
  const app=$('#app');

      <div class="v" style="color:var(--blue)">You: ${esc(describeSelectionFor(tmp,takerSel))}</div>
      <div class="split80">
        <div><div class="k">Leg 1 — house bet (80%)</div><div class="n">${fmt$(p.stake*0.8)}</div><div class="tiny mut">@ ${fmtOdds(p.oppOdds??-110)} — win pays ${payoutPreview(p.stake*0.8, p.oppOdds??-110)}</div></div>
        <div><div class="k">Leg 2 — pot (20%)</div><div class="n">${fmt$(p.stake*0.4)}</div><div class="tiny mut">both sides in — winner takes it</div></div>

  </div>`;

async function acceptFromLink(payload){
  const p = $('#app')._payload;
  let u = me();
  if(!u){ const nm=($('#wn2').value||'').trim()||'Battler'+Math.floor(Math.random()*999);
    const id=uid('u'); DB.users[id]={id,name:nm,createdAt:new Date().toISOString(),credits:CFG.STARTING_CREDITS,settledBets:[],disputesLost:0,winStreak:0,lastSettledAt:null};
    postLedger(id,null,'grant',CFG.STARTING_CREDITS,'Welcome demo credits'); setMe(id); u=DB.users[id]; }
  try{
    let bet = DB.bets.find(b=>b.id===p.id);
    if(!bet){
      // mirror the creator's bet on this device
      const {wager,pot}=splitStake(p.stake);
      bet={ id:p.id, createdAt:p.createdAt, creatorId:p.creatorId, creatorName:p.creatorName, mode:'challenge',
        eventId:p.eventId, league:p.league, homeAbbr:p.homeAbbr, awayAbbr:p.awayAbbr, homeName:p.homeName, awayName:p.awayName,
        eventDate:p.eventDate, market:p.market, selection:p.selection, line:p.line,
        odds:p.odds??-110, oppOdds:p.oppOdds??-110, takerOdds:null,
        consensusLine:p.consensusLine,
        lineSource:p.lineSource, customLine:false, takerId:null, takerName:null, stake:p.stake, wager, potShare:pot,
        status:'open', grade:null, dispute:null, settledAt:null };
      DB.bets.push(bet);
      // creator's stake is accounted on their device; note the mirror
      audit(u.id, bet.id, 'challenge_mirrored', `Challenge ${bet.id} mirrored from link (creator ${p.creatorName}).`);
    }

    location.hash='#/bets'; route();
  }catch(err){ alert(err.message==='insufficient'?'Not enough demo credits.':err.message); }
}

/* ---------- My Bets ---------- */
function myBets(){ const u=me(); return DB.bets.filter(b=>b.creatorId===u.id||b.takerId===u.id).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)); }
function renderMyBets(){
  const app=$('#app'); const bets=myBets();
  app.innerHTML=`<div class="card"><div class="row-flex"><h3 class="grow">🎟️ My Bets</h3>
    <button class="btn btn-ghost btn-sm" onclick="gradeOpenBets(true)">↻ Check finals</button></div>
    <div id="grade-msg"></div>
    ${bets.length? bets.map(betCard).join('') : `<p class="mut">No battles yet. <a href="#/">Pick a game →</a></p>`}
  </div>`;
  bindBetCards();
}
function statusChip(s){ return `<span class="chip chip-${s}">${s.toUpperCase()}</span>`; }
function betCard(b){
  const u=me(); const iAmCreator=b.creatorId===u.id;
  const mySide = iAmCreator? b.selection : (b.takerSelection||oppositeSelection(b.market,b.selection));
  const tmp={homeAbbr:b.homeAbbr,awayAbbr:b.awayAbbr,market:b.market,selection:mySide,line:b.line};
  const opp = b.mode==='challenge' ? (iAmCreator? (b.takerName||'waiting for taker…') : b.creatorName) : 'the House';
  const res = b.grade? `<div class="small" style="margin-top:6px;"><b>Final:</b> ${b.grade.homeScore}-${b.grade.awayScore} ${b.awayAbbr}@${b.homeAbbr} → <b style="color:${b.grade.result==='win'?'var(--green-d)':b.grade.result==='loss'?'var(--red)':'var(--mut)'}">${resultForMe(b).toUpperCase()}</b></div>`:'';
  const pot = b.mode==='challenge' ? fmt$(b.potShare*2) : '—';
  const stakeLine = b.mode==='challenge'
    ? `${fmt$(b.stake)} <span class="tiny mut">(${fmt$(b.wager)} house bet @ ${fmtOdds(b.odds)} + ${fmt$(b.potShare)} pot)</span>`
    : `${fmt$(b.stake)} <span class="tiny mut">house bet @ ${fmtOdds(b.odds)}</span>`;
  return `<div class="card" style="margin-bottom:10px;" data-bet="${b.id}">
    <div class="row-flex"><div class="grow"><b>${esc(b.awayAbbr)} @ ${esc(b.homeAbbr)}</b>
      <span class="tiny mut">${b.league.toUpperCase()} · ${fmtTime(b.eventDate)}</span></div>${statusChip(b.status)}</div>
    <div class="small" style="margin-top:6px;">You: <b>${esc(describeSelectionFor(tmp,mySide))}</b> · vs ${esc(opp)} · ${stakeLine}</div>
    ${res}
    <div class="row-flex" style="margin-top:8px;">
      <button class="btn btn-ghost btn-sm" data-act="slip">📋 Bet slip</button>
      ${b.mode==='challenge'&&b.status==='open'&&iAmCreator?`<button class="btn btn-green btn-sm" data-act="share">🔗 Copy challenge link</button>`:''}
      ${b.status==='settled'?`<button class="btn btn-ghost btn-sm" data-act="dispute">⚠️ Dispute</button>`:''}
    </div>
    <div class="slip hidden" data-slip></div>
  </div>`;
}
function resultForMe(b){
  if(!b.grade) return '';
  const u=me(); const iAmCreator=b.creatorId===u.id;
  if(b.grade.result==='push'||b.grade.result==='void') return b.grade.result;
  const creatorWon = b.grade.result==='win';
  return (iAmCreator===creatorWon)?'win':'loss';
}
function bindBetCards(){
  document.querySelectorAll('[data-bet]').forEach(card=>{
    const bet=DB.bets.find(b=>b.id===card.dataset.bet);
    card.querySelector('[data-act="slip"]').onclick=()=>{ const s=card.querySelector('[data-slip]'); s.classList.toggle('hidden'); if(!s.classList.contains('hidden')) s.innerHTML=slipDetail(bet); };
    const sh=card.querySelector('[data-act="share"]'); if(sh) sh.onclick=()=>{ const l=challengeLink(bet); try{navigator.clipboard.writeText(l);}catch(e){} prompt('Copy your challenge link:', l); };
    const dp=card.querySelector('[data-act="dispute"]'); if(dp) dp.onclick=()=>showDisputeForm(bet);
  });
}
function slipDetail(b){
  const ls = (b.market!=='moneyline' && b.consensusLine!=null)
    ? lineScore(b.market, b.line, b.consensusLine, b.selection) : null;
  const rows=[
    ['Bet ID', b.id], ['Created', fmtTime(b.createdAt)], ['Mode', b.mode==='challenge'?'⚔️ Challenge':'🏠 Vs House'],
    ['Event', `${b.awayName} @ ${b.homeName} — ${fmtTime(b.eventDate)}`],
    ['Market', b.market], ['Creator', `${esc(b.creatorName)}: ${esc(describeSelectionFor({homeAbbr:b.homeAbbr,awayAbbr:b.awayAbbr,market:b.market,selection:b.selection,line:b.line},b.selection))}`],
  ];
  if(b.takerId) rows.push(['Taker', `${esc(b.takerName)}: ${esc(describeSelectionFor({homeAbbr:b.homeAbbr,awayAbbr:b.awayAbbr,market:b.market,selection:b.takerSelection,line:b.line},b.takerSelection))}`]);
  rows.push(['Locked line', `${b.line} <span class="tiny mut">(source: ${b.lineSource}${b.customLine?' · custom':''})</span>`]);
  rows.push(['Odds', b.mode==='challenge'
    ? `creator ${fmtOdds(b.odds)} · taker ${fmtOdds(b.takerOdds??b.oppOdds)}`
    : `${fmtOdds(b.odds)}`]);
  if(b.consensusLine!=null) rows.push(['Consensus at creation', b.consensusLine]);
  if(ls) rows.push(['Line score', `${ls.delta>0?'+':''}${ls.delta} pts → favors <b>${ls.favors==='even'?'neither (even)':ls.favors}</b>`]);
  rows.push(['Stake', b.mode==='challenge'
    ? `${fmt$(b.stake)} = <b>leg 1:</b> ${fmt$(b.wager)} house bet @ ${fmtOdds(b.odds)} <b>+ leg 2:</b> ${fmt$(b.potShare)} challenge pot`
    : `${fmt$(b.stake)} house bet @ ${fmtOdds(b.odds)}`]);
  rows.push(['Status', statusChip(b.status)]);
  if(b.grade) rows.push(['Grade', `${b.grade.result.toUpperCase()} — ${esc(b.grade.rule)} <span class="tiny mut">(${esc(b.grade.source)}, ${fmtTime(b.grade.gradedAt)})</span>`]);
  if(b.settledAt) rows.push(['Settled', fmtTime(b.settledAt)]);
  const entries = DB.ledger.filter(e=>e.battleId===b.id);
  const led = entries.map(e=>`<div class="tiny">${fmtTime(e.ts)} · ${esc(e.type)} · <b>${e.amount>=0?'+':''}${fmt$(e.amount)}</b> <span class="mut">${esc(e.note)}</span></div>`).join('');
  const audits = DB.audit.filter(a=>a.battleId===b.id).map(a=>`<div class="audit"><b>${fmtTime(a.ts)}</b> [${esc(a.kind)}] ${esc(a.text)}</div>`).join('');
  return `<div class="k">Bet slip — immutable record</div>${rows.map(r=>`<div class="small"><span class="mut">${r[0]}:</span> <b>${r[1]}</b></div>`).join('')}
    <div class="k" style="margin-top:8px;">Ledger for this battle</div>${led||'<div class="tiny mut">—</div>'}
    <div class="k" style="margin-top:8px;">Audit trail</div>${audits||'<div class="tiny mut">—</div>'}`;
}
function showDisputeForm(bet){
  const r = prompt('Why is the grade wrong? (reason)');
  if(!r) return;
  const evd = prompt('Evidence (what should it be and why):')||'';
  try{ fileDispute(bet.id, r, evd); alert('Dispute filed. Admin reviews within the app. You have 24h from grading.'); route(); }

/* ---------- Auto-grading loop ---------- */
let grading=false;
async function gradeOpenBets(manual){
  if(grading) return; grading=true;
  const msg=$('#grade-msg');
  try{
    const open = DB.bets.filter(b=>['open','matched','live'].includes(b.status));
    let graded=0, voided=0;
    const byLeague={};
    open.forEach(b=>{ (byLeague[b.league]=byLeague[b.league]||[]).push(b); });
    for(const lg of Object.keys(byLeague)){
      let d; try{ d=await espnScoreboard(lg); }catch(e){ continue; }
      for(const b of byLeague[lg]){
        const raw=(d.events||[]).find(e=>String(e.id)===String(b.eventId));
        if(!raw){
          // event aged off the board: if long past, void it
          if(Date.now()-new Date(b.eventDate).getTime() > 36e5*30){ voidBet(b,'Event left the scoreboard with no result (postponed/cancelled).'); voided++; }
          continue;
        }
        const ev=parseEvent(raw, lg);
        if(ev.completed && ev.homeScore!=null){
          if(b.status==='open'){ /* challenge never matched — void, refund creator */ voidBet(b,'Challenge expired unmatched.'); voided++; continue; }
          settleBet(b, ev.homeScore, ev.awayScore, 'ESPN final'); graded++;
        } else if(ev.state==='in' && b.status!=='live'){ b.status='live'; saveDB(); }
        else if(ev.statusDesc.toLowerCase().includes('postponed')||ev.statusDesc.toLowerCase().includes('cancelled')){
          voidBet(b,'Event '+ev.statusDesc.toLowerCase()+'.'); voided++;
        } else if(Date.now()-new Date(b.eventDate).getTime() > 36e5*26 && !ev.completed){
          voidBet(b,'No result 26h after start (postponement rule).'); voided++;
        }
      }
    }
    if(msg) msg.innerHTML = `<div class="okbox">Checked finals: ${graded} graded, ${voided} voided.</div>`;
    renderTabs();
    if(manual) route();
  }finally{ grading=false; }
}
